name: Release DEBs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debs:
    name: Build DEBs (${{ matrix.distro.name }})
    runs-on: ${{ matrix.distro.runner }}

    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: ubuntu-22.04
            runner: ubuntu-22.04
          - name: ubuntu-24.04
            runner: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps (build tools + yaml-cpp)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config g++ \
            libyaml-cpp-dev \
            dpkg-dev fakeroot

      - name: Configure (Release)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPARAMIFY_BUILD_EXAMPLES=OFF \
            -DPARAMIFY_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build

      - name: Package (.deb via CPack)
        run: |
          cd build
          cpack -G DEB

      - name: Upload DEBs as workflow artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.distro.name }}
          path: build/*.deb
          if-no-files-found: error

      - name: Upload DEBs to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
          fail_on_unmatched_files: true
